# PhantomDev Pre-Commit Configuration
# This configuration enables automatic AI-pattern detection and humanization

repos:
  # Local hooks for PhantomDev
  - repo: local
    hooks:
      # Stealth check for AI signatures
      - id: phantom-dev-stealth-check
        name: PhantomDev Stealth Check
        entry: python3 scripts/stealth_check.py
        language: python
        types: [python, javascript, typescript, rust, go, cpp, c]
        pass_filenames: true

      # Auto-humanize comments
      - id: phantom-dev-humanize-comments
        name: PhantomDev Auto-Humanize
        entry: python3 scripts/auto_humanize.py
        language: python
        types: [python, javascript, typescript, rust, go, cpp, c]
        pass_filenames: true

      # Check commit message entropy
      - id: phantom-dev-commit-entropy
        name: PhantomDev Commit Entropy
        entry: python3 scripts/check_commit_entropy.py
        language: python
        stages: [commit-msg]

      # Variable naming check
      - id: phantom-dev-naming-check
        name: PhantomDev Naming Check
        entry: python3 scripts/naming_check.py
        language: python
        types: [python, javascript, typescript, rust, go, cpp, c]
        pass_filenames: true

  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
